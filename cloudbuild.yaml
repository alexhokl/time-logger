logsBucket: "gs://craffy-build-logs"

options:
  machineType: E2_HIGHCPU_8
  logging: GCS_ONLY

timeout: "1800s"

substitutions:
  _FLUTTER_IMAGE: "asia-east1-docker.pkg.dev/craffy/private/flutter:3.47.7"

availableSecrets:
  secretManager:
    - versionName: projects/craffy/secrets/time-logger-keystore/versions/latest
      env: KEYSTORE_B64
    - versionName: projects/craffy/secrets/time-logger-key-properties/versions/latest
      env: KEY_PROPERTIES

steps:
  # Unlike the reference project, the tests and linters run before anything is
  # published. A tag-triggered build is the last chance to catch a regression
  # before it is deployed, and the suite is fast enough that gating on it costs
  # almost nothing.
  - name: "golang:1.26"
    id: Test
    waitFor: ["-"]
    entrypoint: go
    args: ["test", "./..."]

  - name: "gcr.io/cloud-builders/docker"
    id: Build
    waitFor: [Test]
    args:
      - "build"
      - "-t"
      - "asia-east1-docker.pkg.dev/$PROJECT_ID/private/time-logger:$TAG_NAME"
      - "-t"
      - "asia-east1-docker.pkg.dev/$PROJECT_ID/private/time-logger:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: Push
    waitFor: [Build]
    args:
      - "push"
      - "--all-tags"
      - "asia-east1-docker.pkg.dev/$PROJECT_ID/private/time-logger"

  # The Flutter steps run in parallel with the server image: neither depends on
  # the other, and the APK build dominates the wall-clock time.
  - name: "${_FLUTTER_IMAGE}"
    id: Build APK
    waitFor: ["-"]
    # Writes local.properties and the signing files, runs pub get, the tests
    # and builds the release APK; see build-apk in the flutter-build image.
    entrypoint: build-apk
    args: ["mobile"]
    secretEnv: ["KEYSTORE_B64", "KEY_PROPERTIES"]
    env:
      - "GIT_COMMIT=$SHORT_SHA"
      - "RUN_TESTS=true"

  - name: "gcr.io/cloud-builders/gcloud"
    id: Upload APK
    waitFor: [Build APK]
    entrypoint: gcloud
    args:
      - storage
      - cp
      - mobile/build/app/outputs/flutter-apk/app-release.apk
      - gs://alexhokl_public/apk/time_logger-$TAG_NAME-$SHORT_SHA.apk
