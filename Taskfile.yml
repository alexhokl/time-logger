version: "3"

env:
  APP_NAME: time-logger
  IMAGE: asia-east1-docker.pkg.dev/craffy/public/time-logger

includes:
  flutter:
    taskfile: ../flutter-helper/taskfiles/flutter.yml
    flatten: true
    vars:
      APP: time-logger
      MAC_APP: time_logger.app
      MAC_INSTALL_APP: time logger.app

tasks:
  default:
    desc: List available tasks
    cmd: task --list
    silent: true

  build:
    desc: Compile everything without producing a binary
    cmd: go build -o /dev/null ./...

  install:
    desc: Install the binary into GOBIN
    cmd: go install

  test:
    desc: Run the Go and Flutter test suites
    cmds:
      - go test ./...
      - cd mobile && flutter test --no-pub

  coverage:
    desc: Run the Go tests with a coverage summary
    cmd: go test --cover ./...

  coverage-html:
    desc: Produce an HTML coverage report for the Go code
    cmd: go test -coverprofile=coverage.out ./... && go tool cover -html=coverage.out -o coverage.html

  lint:
    desc: Lint the Go and Dart code
    cmds:
      - golangci-lint run
      - go tool buf lint
      - cd mobile && dart analyze

  lint-fix:
    desc: Apply the automatic Dart fixes
    dir: mobile
    cmd: dart fix --apply

  sec:
    desc: Run the gosec security scanner
    cmd: gosec ./...

  proto:
    desc: Regenerate the Go and Dart code from the protobuf definitions
    cmds:
      - go tool buf lint
      - go tool buf generate
      - task: proto-fmt

  proto-fmt:
    desc: Format the protobuf definitions in place
    cmd: go tool buf format -w

  proto-breaking:
    desc: Check the protobuf definitions for breaking changes against main
    cmd: go tool buf breaking --against '.git#branch=main'

  run:
    desc: Run the server locally against a scratch database
    cmd: go run . serve --database ./time-logger.db --port 8080

  image:
    desc: Build the Docker image locally
    preconditions:
      - test -f Dockerfile
      - sh: docker version
        msg: Docker does not appear to be running
    cmd: docker build -t $IMAGE:local .

  architecture-watch:
    desc: Watch and re-render the architecture diagram
    cmd: d2 --watch --theme 302 ./documentation/architecture.d2
